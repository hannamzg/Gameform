<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة المهن الذكية - عالم الألوان وذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;600;800&family=Cairo:wght@900&display=swap');
        
        body {
            font-family: 'Changa', sans-serif;
            background: #fff5f7;
            background-image: 
                url("https://www.transparenttextures.com/patterns/cubes.png"),
                linear-gradient(135deg, #fff5f7 0%, #e0f2fe 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #334155;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Cairo', sans-serif;
        }

        .career-card {
            position: relative;
            background: white;
            border: 8px solid white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border-radius: 4rem;
            box-shadow: 0 15px 0 rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .career-card:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 25px 0 rgba(0,0,0,0.08);
            z-index: 10;
        }

        .career-card.correct {
            background: #4ade80 !important;
            border-color: #ffffff !important;
            animation: bounce-happy 0.8s ease;
        }

        .career-card.wrong {
            background: #fb7185 !important;
            border-color: #ffffff !important;
            animation: shake 0.5s ease;
        }

        @keyframes bounce-happy {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-40px) scale(1.15) rotate(5deg); }
            50% { transform: translateY(0) scale(1) rotate(-5deg); }
            70% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }

        .target-panel {
            background: white;
            border-radius: 4rem;
            border: 10px solid #ffd60a;
            box-shadow: 0 20px 0 #ffc300;
        }

        .floating-icon {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="title-font text-5xl md:text-8xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-b from-pink-400 to-purple-600 drop-shadow-sm">
                مملكة المهن ✨
            </h1>
            <div class="inline-block bg-white/80 backdrop-blur px-8 py-2 rounded-full shadow-sm text-purple-600 font-bold text-xl">
                مرحباً بك في عالم المعرفة الذكي! 🌈
            </div>
        </header>

        <!-- Target Window -->
        <div class="target-panel p-8 mb-16 relative overflow-hidden group">
            <div class="absolute -right-10 -top-10 text-9xl opacity-10 group-hover:rotate-12 transition-transform duration-700">⭐</div>
            <h2 class="text-2xl text-gray-400 mb-2 font-black">أين يختبئ البطل...</h2>
            <div id="targetProfession" class="title-font text-6xl md:text-9xl font-black text-blue-500 drop-shadow-lg transition-all duration-500">
                تحميل...
            </div>
        </div>

        <!-- AI Assistant Panel ✨ -->
        <div class="bg-white/90 backdrop-blur-md rounded-[3rem] p-6 mb-10 shadow-xl border-4 border-indigo-200">
            <div class="flex items-center gap-4 mb-4">
                <span class="text-4xl">🤖</span>
                <h3 class="text-2xl font-black text-indigo-600">مساعد المهن الذكي ✨</h3>
            </div>
            <p id="aiMessage" class="text-lg text-gray-600 mb-6 font-semibold">هل تريد معرفة المزيد عن مهنة اليوم؟ اضغط على الزر السحري!</p>
            <div class="flex flex-wrap gap-4">
                <button id="tellStoryBtn" onclick="generateCareerStory()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2">
                    <span>✨ احكِ لي قصة</span>
                </button>
                <button id="voiceExplainBtn" onclick="explainWithVoice()" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2">
                    <span>🎙️ شرح صوتي</span>
                </button>
            </div>
            <div id="aiLoading" class="hidden mt-4 flex items-center gap-3 text-indigo-500 font-bold">
                <div class="loading-spinner"></div>
                <span>جاري استدعاء الذكاء الاصطناعي...</span>
            </div>
            <div id="aiResponseContainer" class="hidden mt-6 p-6 bg-indigo-50 rounded-3xl border-2 border-indigo-100 text-gray-700 leading-relaxed max-h-60 overflow-y-auto">
                <!-- AI Content -->
            </div>
        </div>

        <!-- Dashboard -->
        <div class="flex flex-wrap justify-between items-center mb-10 gap-4 px-4">
            <div class="flex gap-4">
                <div class="bg-white px-8 py-4 rounded-3xl shadow-lg border-b-8 border-orange-200 flex items-center gap-4">
                    <span class="text-5xl">🍭</span>
                    <div>
                        <div class="text-sm text-gray-400 font-bold uppercase">النقاط</div>
                        <div id="scoreCount" class="text-4xl font-black text-orange-500 leading-none">0</div>
                    </div>
                </div>
                <div class="bg-white px-8 py-4 rounded-3xl shadow-lg border-b-8 border-blue-200 flex items-center gap-4">
                    <span class="text-5xl">🔥</span>
                    <div>
                        <div class="text-sm text-gray-400 font-bold uppercase">السرعة</div>
                        <div id="streakCount" class="text-4xl font-black text-blue-500 leading-none">0</div>
                    </div>
                </div>
            </div>
            
            <button onclick="resetGame()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-10 py-5 rounded-[2.5rem] font-black text-xl shadow-xl hover:brightness-110 active:scale-95 transition-all border-b-8 border-purple-700">
                🔄 العب مرة أخرى!
            </button>
        </div>

        <!-- Cards Grid -->
        <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-10">
            <!-- Populated via JS -->
        </div>

        <!-- Pop-up Feedback -->
        <div id="feedback" class="fixed inset-0 flex items-center justify-center pointer-events-none z-50 transition-all duration-700 opacity-0 scale-0">
            <div class="bg-white p-12 rounded-[5rem] shadow-[0_30px_60px_rgba(0,0,0,0.2)] border-[12px] border-yellow-400 transform -rotate-3">
                <span id="feedbackText" class="title-font text-5xl md:text-8xl font-black text-gray-800">أنت أسطورة! 🍦</span>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // يتم توفير المفتاح تلقائياً في البيئة

        const professions = [
            { id: 1, title: "طبيب", icon: "🧑‍⚕️", color: "bg-gradient-to-br from-red-400 to-red-100" },
            { id: 2, title: "مهندس", icon: "👷", color: "bg-gradient-to-br from-yellow-400 to-yellow-100" },
            { id: 3, title: "معلم", icon: "🧑‍🏫", color: "bg-gradient-to-br from-blue-400 to-blue-100" },
            { id: 4, title: "طباخ", icon: "🧑‍🍳", color: "bg-gradient-to-br from-orange-400 to-orange-100" },
            { id: 5, title: "مبرمج", icon: "🧑‍💻", color: "bg-gradient-to-br from-indigo-400 to-indigo-100" },
            { id: 6, title: "إطفائي", icon: "👨‍🚒", color: "bg-gradient-to-br from-rose-400 to-rose-100" },
            { id: 7, title: "مصور", icon: "📸", color: "bg-gradient-to-br from-purple-400 to-purple-100" },
            { id: 8, title: "رسام", icon: "🎨", color: "bg-gradient-to-br from-pink-400 to-pink-100" },
            { id: 10, title: "مزارع", icon: "🧑‍🌾", color: "bg-gradient-to-br from-green-400 to-green-100" },
            { id: 11, title: "نجار", icon: "🔨", color: "bg-gradient-to-br from-amber-400 to-amber-100" },
            { id: 12, title: "طبيب أسنان", icon: "🦷", color: "bg-gradient-to-br from-cyan-400 to-cyan-100" },
            { id: 13, title: "حلاق", icon: "💇", color: "bg-gradient-to-br from-sky-400 to-sky-100" },
            { id: 14, title: "خباز", icon: "🥖", color: "bg-gradient-to-br from-amber-500 to-orange-100" },
            { id: 15, title: "خياط", icon: "🧵", color: "bg-gradient-to-br from-teal-400 to-teal-100" },
            { id: 18, title: "قاضي", icon: "⚖️", color: "bg-gradient-to-br from-slate-400 to-slate-100" },
            { id: 20, title: "صحفي", icon: "🎤", color: "bg-gradient-to-br from-red-500/40 to-white" }
        ];

        let targetId = null;
        let score = 0;
        let streak = 0;
        let currentTargetProfession = null;

        // دالة للمساعدة في طلبات API مع Exponential Backoff
        async function fetchGemini(url, payload, retries = 5, delay = 1000) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return fetchGemini(url, payload, retries - 1, delay * 2);
                }
                throw error;
            }
        }

        // تحويل PCM إلى WAV للتشغيل الصوتي
        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        // ✨ توليد قصة قصيرة عن المهنة الحالية باستخدام Gemini
        async function generateCareerStory() {
            if (!currentTargetProfession) return;
            const loading = document.getElementById('aiLoading');
            const responseContainer = document.getElementById('aiResponseContainer');
            
            loading.classList.remove('hidden');
            responseContainer.classList.add('hidden');

            const prompt = `اكتب قصة قصيرة جداً وممتعة للأطفال (3 جمل) عن مهنة ${currentTargetProfession.title}. ابدأ بـ "كان يا ما كان". القصة يجب أن تكون تعليمية وملهمة.`;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            try {
                const result = await fetchGemini(url, {
                    contents: [{ parts: [{ text: prompt }] }]
                });
                const story = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                responseContainer.innerHTML = `<p class="font-bold text-indigo-800 mb-2">📖 قصة الـ ${currentTargetProfession.title}:</p><p>${story}</p>`;
                responseContainer.classList.remove('hidden');
            } catch (error) {
                responseContainer.innerHTML = `<p class="text-red-500">عذراً، الروبوت نائم الآن! حاول لاحقاً.</p>`;
                responseContainer.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // ✨ شرح صوتي باستخدام Gemini TTS
        async function explainWithVoice() {
            if (!currentTargetProfession) return;
            const loading = document.getElementById('aiLoading');
            loading.classList.remove('hidden');

            const prompt = `Say in a friendly, cheerful voice for a child: "هل تعرف ماذا يفعل الـ ${currentTargetProfession.title}؟ إنه يقوم بمهام رائعة جداً لمساعدة الناس!"`;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

            try {
                const result = await fetchGemini(url, {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                    }
                });

                const audioData = result.candidates[0].content.parts[0].inlineData.data;
                const binaryString = atob(audioData);
                const pcmData = new Int16Array(binaryString.length / 2);
                for (let i = 0; i < pcmData.length; i++) {
                    pcmData[i] = (binaryString.charCodeAt(i * 2 + 1) << 8) | binaryString.charCodeAt(i * 2);
                }

                const wavBlob = pcmToWav(pcmData, 24000); // 24kHz common for this model
                const audioUrl = URL.createObjectURL(wavBlob);
                const audio = new Audio(audioUrl);
                audio.play();
            } catch (error) {
                console.error("TTS Error", error);
            } finally {
                loading.classList.add('hidden');
            }
        }

        function initGrid() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            const shuffled = [...professions].sort(() => Math.random() - 0.5);

            shuffled.forEach(p => {
                const card = document.createElement('div');
                card.className = `career-card p-10 flex flex-col items-center justify-center gap-6 ${p.color}`;
                card.onclick = () => checkChoice(p.id, card);
                card.innerHTML = `
                    <div class="text-9xl floating-icon drop-shadow-lg">${p.icon}</div>
                    <div class="text-3xl font-black text-gray-800 tracking-tight">${p.title}</div>
                `;
                grid.appendChild(card);
            });
            setNewTarget();
        }

        function setNewTarget() {
            const randomP = professions[Math.floor(Math.random() * professions.length)];
            targetId = randomP.id;
            currentTargetProfession = randomP;
            const targetEl = document.getElementById('targetProfession');
            
            // Reset AI UI
            document.getElementById('aiResponseContainer').classList.add('hidden');
            document.getElementById('aiMessage').innerText = `هل تريد معرفة المزيد عن مهنة ${randomP.title}؟ اضغط على الزر السحري!`;

            targetEl.style.transform = 'translateY(50px) scale(0.5)';
            targetEl.style.opacity = '0';
            
            setTimeout(() => {
                targetEl.innerText = randomP.title;
                targetEl.style.transform = 'translateY(0) scale(1)';
                targetEl.style.opacity = '1';
            }, 400);
        }

        function checkChoice(id, element) {
            if (id === targetId) {
                score += 15;
                streak++;
                element.classList.add('correct');
                showFeedback(getEncouragement(), true);
                celebrate();
                setTimeout(() => {
                    element.classList.remove('correct');
                    setNewTarget();
                    updateUI();
                }, 1200);
            } else {
                streak = 0;
                element.classList.add('wrong');
                showFeedback("أوه! حاول مجدداً يا ذكي 🍩", false);
                setTimeout(() => {
                    element.classList.remove('wrong');
                    updateUI();
                }, 600);
            }
        }

        function getEncouragement() {
            const phrases = ["عبقري! 🍭", "مذهل جداً! 🎈", "أنت بطل حقيقي! 🏆", "إجابة ذكية! 🌟", "يا لك من فنان! 🎨"];
            return phrases[Math.floor(Math.random() * phrases.length)];
        }

        function updateUI() {
            document.getElementById('scoreCount').innerText = score;
            document.getElementById('streakCount').innerText = streak;
        }

        function showFeedback(msg, isSuccess) {
            const fb = document.getElementById('feedback');
            const fbText = document.getElementById('feedbackText');
            fbText.innerText = msg;
            fb.classList.remove('opacity-0', 'scale-0');
            fb.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                fb.classList.add('opacity-0', 'scale-0');
                fb.classList.remove('opacity-100', 'scale-100');
            }, 1200);
        }

        function celebrate() {
            const shapes = ['❤️', '⭐', '✨', '🍭', '🧁', '🎈'];
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.className = 'fixed pointer-events-none z-[100] animate-fall text-2xl';
                conf.innerText = shapes[Math.floor(Math.random() * shapes.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-50px';
                
                // Inline animation since we added dynamic class
                const duration = Math.random() * 2 + 1;
                conf.style.animation = `fall ${duration}s linear forwards`;
                
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3000);
            }
        }

        // Add CSS for confetti dynamically
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        function resetGame() {
            score = 0;
            streak = 0;
            updateUI();
            initGrid();
        }

        window.onload = initGrid;
    </script>
</body>
</html>
